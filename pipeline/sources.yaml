# Ingestion sources. Add, remove, or toggle `enabled: false` freely.
# Lookback is 168 hours (7 days) for all by default — matches retention.
#
# Quality tiers (for reference; not enforced in code):
#   Tier A — high signal, edited by professional desks, low churn.
#            Reuters · AP · BBC · WSJ · FT · The Guardian · The Hindu ·
#            Indian Express · Bloomberg · MIT Tech Review · Nature ·
#            Quanta · Ars Technica · Stratechery · NPR · Politico
#   Tier B — good but sometimes trendy/click-driven. TechCrunch · Verge ·
#            CNBC · MarketWatch · The Hill · TLDR · Axios · Wired
#   Tier C — variable, community-driven, but occasionally exceptional.
#            Reddit · HN · Substacks · DW · France 24
#
# Types: hn · rss · reddit · tldr · gmail
#
# Cross-source enrichment (PLAN Phase 2) means Tier-A duplicates of Tier-B
# / Tier-C stories now UPGRADE the existing summary rather than being
# dropped. The more high-quality sources we add, the richer each story
# gets — this is what "hydrate the content" means in this pipeline.

sources:

