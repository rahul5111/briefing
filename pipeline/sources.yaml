# Ingestion sources. Add, remove, or toggle `enabled: false` freely.
# Lookback is 168 hours (7 days) for all by default — matches retention.
#
# Types:
#   hn      — Hacker News (Algolia API)
#   rss     — any RSS or Atom feed (blogs, newsletters, Substack, Beehiiv...)
#   reddit  — subreddit via public JSON (anonymous, rate-limited)

sources:

  # ─── Hacker News ────────────────────────────────────────────────
  - name: hackernews
    type: hn
    tags: story
    min_score: 200
    lookback_hours: 168
    max_items: 40

  - name: hackernews_show
    type: hn
    tags: show_hn
    min_score: 100
    lookback_hours: 168
    max_items: 15

  # ─── Tech blogs (RSS) ───────────────────────────────────────────
  - name: verge
    type: rss
    url: https://www.theverge.com/rss/index.xml
    lookback_hours: 168
    max_items: 20

  - name: ars_technica
    type: rss
    url: https://feeds.arstechnica.com/arstechnica/index
    lookback_hours: 168
    max_items: 20

  - name: techcrunch
    type: rss
    url: https://techcrunch.com/feed/
    lookback_hours: 168
    max_items: 20

  - name: mit_tech_review
    type: rss
    url: https://www.technologyreview.com/feed/
    lookback_hours: 168
    max_items: 15

  # ─── Science ────────────────────────────────────────────────────
  - name: sciencedaily_top
    type: rss
    url: https://www.sciencedaily.com/rss/top.xml
    lookback_hours: 168
    max_items: 15

  - name: sciencedaily_tech
    type: rss
    url: https://www.sciencedaily.com/rss/matter_energy/computer_science.xml
    lookback_hours: 168
    max_items: 15

  # ─── Google News (RSS) ──────────────────────────────────────────
  # Google News exposes RSS at every locale / topic. We slice by edition
  # + topic to feed the new 8-cat taxonomy (US, India, World, Business,
  # Sports, Tech). See PLAN.md § 2.
  - name: google_news_top_us
    type: rss
    url: https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en
    lookback_hours: 48
    max_items: 20

  - name: google_news_us_topic
    type: rss
    url: https://news.google.com/rss/headlines/section/topic/NATION.en_us/US?hl=en-US&gl=US&ceid=US:en
    lookback_hours: 48
    max_items: 20

  - name: google_news_india
    type: rss
    url: https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en
    lookback_hours: 48
    max_items: 20

  - name: google_news_world
    type: rss
    url: https://news.google.com/rss/headlines/section/topic/WORLD?hl=en-US&gl=US&ceid=US:en
    lookback_hours: 48
    max_items: 20

  - name: google_news_business
    type: rss
    url: https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-US&gl=US&ceid=US:en
    lookback_hours: 48
    max_items: 20

  - name: google_news_sports
    type: rss
    url: https://news.google.com/rss/headlines/section/topic/SPORTS?hl=en-US&gl=US&ceid=US:en
    lookback_hours: 48
    max_items: 20

  - name: google_news_tech
    type: rss
    url: https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-US&gl=US&ceid=US:en
    lookback_hours: 48
    max_items: 20

  # ─── World news (RSS) ───────────────────────────────────────────
  - name: bbc_world
    type: rss
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    lookback_hours: 168
    max_items: 20

  - name: reuters_world
    type: rss
    url: https://www.reutersagency.com/feed/?best-topics=world&post_type=best
    lookback_hours: 168
    max_items: 15

  - name: aljazeera
    type: rss
    url: https://www.aljazeera.com/xml/rss/all.xml
    lookback_hours: 168
    max_items: 15

  # ─── Newsletters / long-form (RSS) ──────────────────────────────
  - name: stratechery
    type: rss
    url: https://stratechery.com/feed/
    lookback_hours: 168
    max_items: 10

  - name: platformer
    type: rss
    url: https://www.platformer.news/feed
    lookback_hours: 168
    max_items: 10

  # ─── Reddit ─────────────────────────────────────────────────────
  - name: reddit_programming
    type: reddit
    subreddit: programming
    listing: top
    when: week
    min_score: 500
    lookback_hours: 168
    max_items: 15

  - name: reddit_worldnews
    type: reddit
    subreddit: worldnews
    listing: top
    when: week
    min_score: 5000
    lookback_hours: 168
    max_items: 15

  # ─── TLDR curated dailies (scraped, no login needed) ────────────
  # Each variant is a distinct free daily newsletter from tldr.tech.
  # Content is TLDR's own curation — high signal per issue.
  - name: tldr_tech
    type: tldr
    variant: tech
    lookback_days: 2
    max_items: 20

  - name: tldr_ai
    type: tldr
    variant: ai
    lookback_days: 2
    max_items: 20

  - name: tldr_webdev
    type: tldr
    variant: webdev
    lookback_days: 2
    max_items: 15

  - name: tldr_infosec
    type: tldr
    variant: infosec
    lookback_days: 2
    max_items: 15

  - name: tldr_design
    type: tldr
    variant: design
    lookback_days: 2
    max_items: 10

  # ─── Gmail newsletters ──────────────────────────────────────────
  # Reads only emails from senders in the allowlist below. Needs three
  # env vars: GMAIL_REFRESH_TOKEN / GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET.
  # Run `python -m pipeline.gmail_auth credentials.json` once to generate.
  # Add your newsletter sender addresses to `senders:` below.
  - name: gmail_newsletters
    type: gmail
    enabled: false                # flip to true after OAuth setup + secrets
    lookback_hours: 168
    max_items: 25
    default_score: 300            # newsletters are curated, so give them weight
    senders:
      # - platformer@substack.com
      # - hi@morningbrew.com
      # - stratechery@stratechery.com
      # - your-newsletter@example.com
