name: briefing-pipeline

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: briefing-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install python deps
        run: pip install -r pipeline/requirements.txt

      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: .models
          key: kokoro-v1.0

      - name: Cache sentence-transformers
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: st-minilm-l6-v2

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m pipeline.run

      - name: Run retention
        run: python -m pipeline.retention

      - name: Commit changes
        run: |
          git config user.name "briefing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "briefing: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No changes to commit."
          fi
          # Vercel's Git integration auto-deploys on this push.
