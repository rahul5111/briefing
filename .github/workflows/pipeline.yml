name: briefing-pipeline

on:
  schedule:
    # 3× daily, spaced to catch morning/afternoon/night cycles
    # 12:00 UTC = 07:00 US Central, 19:00 UTC = 14:00 US Central,
    # 02:00 UTC = 21:00 US Central (previous day).
    - cron: "0 12,19,2 * * *"
  workflow_dispatch: {}

concurrency:
  group: briefing-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install python deps
        run: pip install -r pipeline/requirements.txt

      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: .models
          key: kokoro-v1.0

      - name: Cache sentence-transformers
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: st-minilm-l6-v2

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.run

      - name: Run retention
        run: python -m pipeline.retention

      - name: Commit changes
        id: commit
        run: |
          git config user.name "briefing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/public/data data/reviews 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "briefing: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node for Vercel deploy
        if: steps.commit.outputs.committed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: steps.commit.outputs.committed == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: steps.commit.outputs.committed == 'true'
        working-directory: site
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        if: steps.commit.outputs.committed == 'true'
        working-directory: site
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to Vercel production
        if: steps.commit.outputs.committed == 'true'
        working-directory: site
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
